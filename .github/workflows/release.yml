name: Matrix Release Plugin Components

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

defaults:
  run:
    working-directory: santity-plugins

jobs:
  build-and-release:
    name: Build & Release Plugin Matrix
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - pkg_name: ping-pong-plugin
            wasm_file: ping_pong_plugin
            component_name: ping_pong
          - pkg_name: santity-mod
            wasm_file: santity_mod
            component_name: santity_mod
          - pkg_name: santity-guard
            wasm_file: santity_guard
            component_name: santity_guard
          - pkg_name: santity-tickets
            wasm_file: santity_tickets
            component_name: santity_tickets
          - pkg_name: santity-roles
            wasm_file: santity_roles
            component_name: santity_roles
          - pkg_name: santity-voicemaster
            wasm_file: santity_voicemaster
            component_name: santity_voicemaster
    steps:
      - uses: actions/checkout@v4
        with:
          path: santity-plugins

      - uses: actions/checkout@v4
        with:
          repository: segv-oss/santity-pdk
          path: santity-pdk

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: taiki-e/install-action@wasm-tools

      - name: Build Plugin WASM Binary
        run: cargo build --release --target wasm32-unknown-unknown -p ${{ matrix.pkg_name }}

      - name: Package WebAssembly Component
        run: |
          wasm-tools component new target/wasm32-unknown-unknown/release/${{ matrix.wasm_file }}.wasm -o ${{ matrix.component_name }}.component.wasm

      - name: Upload Component Asset to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'nightly' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Nightly Development Build' }}
          files: santity-plugins/${{ matrix.component_name }}.component.wasm
          generate_release_notes: true
